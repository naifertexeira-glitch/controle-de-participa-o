<script>
    let appData = {
        schoolName: "Colégio Estadual de Educação Física",
        schoolLogo: "",
        currentClassId: null,
        classes: []
    };
    let isSyncing = false;
    let pendingSavePayload = null;

    function setSyncStatus(status) {
        const el = document.getElementById('syncStatus');
        if (!el) return;
        if (status === 'saving') {
            el.textContent = '☁️ Salvando...';
        } else if (status === 'ok') {
            el.textContent = '☁️ Salvo na nuvem';
        } else if (status === 'offline') {
            el.textContent = '☁️ Modo Local (Offline/Nuvem Sem API)';
        } else {
            el.textContent = '☁️ Carregando...';
        }
    }

    window.onload = function() {
        setSyncStatus('loading');
        loadData().then(() => {
            renderClassSelector();
            renderClassTable();
            renderActiveTabData();
        }).catch(err => {
            console.error("Erro na inicialização:", err);
            setSyncStatus('offline');
            renderClassSelector();
            renderClassTable();
            renderActiveTabData();
        });
    };

    function saveData() {
        const payload = JSON.stringify(appData);

        // Backup local garantido sempre
        try {
            localStorage.setItem('pe_app_data_v2', payload);
        } catch(e) {
            console.error("Erro ao salvar backup no localStorage:", e);
        }

        if (isSyncing) {
            pendingSavePayload = payload;
            return;
        }

        isSyncing = true;
        setSyncStatus('saving');

        fetch('/api/state', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: payload
        })
        .then(res => {
            if (!res.ok) throw new Error('Falha HTTP ' + res.status);
            setSyncStatus('ok');
        })
        .catch(e => {
            console.warn("Servidor de banco não disponível, mantido no localStorage:", e.message);
            setSyncStatus('offline');
        })
        .finally(() => {
            isSyncing = false;
            if (pendingSavePayload) {
                const next = pendingSavePayload;
                pendingSavePayload = null;
                saveData(); // Reprocessa salvamento pendente de forma segura
            }
        });
    }

    async function loadData() {
        let loadedFromServer = false;
        let serverHasData = false;

        // 1. Tenta carregar do servidor com tratamento de erros rigoroso
        try {
            const res = await fetch('/api/state');
            if (res.ok) {
                const json = await res.json();
                if (json && json.ok && json.data && typeof json.data === 'object') {
                    appData = json.data;
                    loadedFromServer = true;
                    serverHasData = true;
                    setSyncStatus('ok');
                }
            } else {
                console.warn(`Servidor respondeu com status ${res.status}. Usando armazenamento local.`);
            }
        } catch (e) {
            console.warn("API de nuvem indisponível ou em ambiente estático. Erro:", e.message);
        }

        // 2. Se a nuvem falhar, carrega os dados locais do navegador
        if (!loadedFromServer) {
            setSyncStatus('offline');
            try {
                const local = localStorage.getItem('pe_app_data_v2');
                if (local) {
                    const parsed = JSON.parse(local);
                    if (!serverHasData && parsed && typeof parsed === 'object') {
                        appData = parsed;
                    }
                }
            } catch (e) {
                console.error("Erro ao carregar dados do localStorage:", e);
            }
        }

        // 3. Normalização dos dados da aplicação
        if (!appData.classes) appData.classes = [];

        appData.classes.forEach(c => {
            if (!c.students) c.students = [];
            if (!c.lessons) c.lessons = [];
            if (!c.extraGrades) c.extraGrades = { q1: {}, q2: {}, q3: {} };
            if (!c.recovery) c.recovery = { q1: {}, q2: {}, q3: {}, annual: {} };
        });

        // Caso inicial: Nenhuma turma cadastrada
        if (appData.classes.length === 0) {
            const defaultClass = {
                id: 'c1',
                name: '6º Ano A',
                teacher: 'Prof. Carlos',
                level: 'fund2',
                students: [
                    { id: 's1', name: 'Ana Clara Souza' },
                    { id: 's2', name: 'Bernardo Lima' },
                    { id: 's3', name: 'Gabriel Rodrigues' }
                ],
                lessons: [],
                extraGrades: { q1: {}, q2: {}, q3: {} },
                recovery: { q1: {}, q2: {}, q3: {}, annual: {} }
            };
            appData.classes.push(defaultClass);
            appData.currentClassId = 'c1';
            appData._needsInitialSync = true;
        }

        if (!appData.currentClassId && appData.classes.length > 0) {
            appData.currentClassId = appData.classes[0].id;
        }

        // Preenchimento de inputs da interface
        const nameInput = document.getElementById('schoolNameInput');
        if (nameInput) nameInput.value = appData.schoolName || 'Colégio Estadual de Educação Física';
        
        if (appData.schoolLogo) {
            const logoEl = document.getElementById('schoolLogo');
            const placeholderEl = document.getElementById('logoPlaceholder');
            const printLogoEl = document.getElementById('printLogo');

            if (logoEl) { logoEl.src = appData.schoolLogo; logoEl.style.display = 'block'; }
            if (placeholderEl) { placeholderEl.style.display = 'none'; }
            if (printLogoEl) { printLogoEl.src = appData.schoolLogo; printLogoEl.style.display = 'block'; }
        }

        if (appData._needsInitialSync) {
            delete appData._needsInitialSync;
            saveData();
        }
    }

    function saveSchoolName() {
        const input = document.getElementById('schoolNameInput');
        if (input) {
            appData.schoolName = input.value;
            saveData();
        }
    }

    function uploadLogo(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 200;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const resizedDataUrl = canvas.toDataURL('image/png', 0.8);
                    appData.schoolLogo = resizedDataUrl;

                    const logoEl = document.getElementById('schoolLogo');
                    const placeholderEl = document.getElementById('logoPlaceholder');
                    const printLogoEl = document.getElementById('printLogo');

                    if (logoEl) { logoEl.src = resizedDataUrl; logoEl.style.display = 'block'; }
                    if (placeholderEl) { placeholderEl.style.display = 'none'; }
                    if (printLogoEl) { printLogoEl.src = resizedDataUrl; printLogoEl.style.display = 'block'; }
                    
                    saveData();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function getActiveClass() {
        if (!appData.classes || appData.classes.length === 0) return null;
        return appData.classes.find(c => c.id === appData.currentClassId) || appData.classes[0];
    }

    function openTab(tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

        const targetTab = document.getElementById(tabId);
        if (targetTab) targetTab.classList.add('active');
        if (btnElement) btnElement.classList.add('active');

        renderActiveTabData();
    }

    function renderActiveTabData() {
        renderStudentList();
        renderLessonHistory();
        renderNonParticipantsChecklist();
        renderEvalInputs();
        renderQuarterTable(1);
        renderQuarterTable(2);
        renderQuarterTable(3);
        renderMediasTable();
        renderRecoveryTable();
        renderPrintReport();
    }

    // --- GERENCIAMENTO DE TURMAS E ALUNOS ---
    function renderClassSelector() {
        const select = document.getElementById('currentClassSelect');
        if (!select) return;
        select.innerHTML = '';
        appData.classes.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name;
            if (c.id === appData.currentClassId) opt.selected = true;
            select.appendChild(opt);
        });
    }

    function switchClass() {
        const select = document.getElementById('currentClassSelect');
        if (!select) return;
        appData.currentClassId = select.value;
        saveData();
        renderActiveTabData();
    }

    function renderClassTable() {
        const tbody = document.getElementById('classListTable');
        if (!tbody) return;
        tbody.innerHTML = '';
        appData.classes.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${c.name}</strong></td>
                <td>${c.teacher}</td>
                <td>${c.level}</td>
                <td>
                    <button class="btn btn-warning" style="padding: 2px 6px; font-size:0.75rem;" onclick="editClass('${c.id}')">Editar</button>
                    <button class="btn btn-danger" style="padding: 2px 6px; font-size:0.75rem;" onclick="deleteClass('${c.id}')">Excluir</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function saveClass(e) {
        e.preventDefault();
        const id = document.getElementById('classId').value;
        const name = document.getElementById('className').value;
        const teacher = document.getElementById('teacherName').value;
        const level = document.getElementById('classLevel').value;

        if (id) {
            const cls = appData.classes.find(c => c.id === id);
            if (cls) {
                cls.name = name;
                cls.teacher = teacher;
                cls.level = level;
            }
        } else {
            const newClass = {
                id: 'c_' + Date.now(),
                name,
                teacher,
                level,
                students: [],
                lessons: [],
                extraGrades: { q1: {}, q2: {}, q3: {} },
                recovery: { q1: {}, q2: {}, q3: {}, annual: {} }
            };
            appData.classes.push(newClass);
            appData.currentClassId = newClass.id;
        }

        saveData();
        resetClassForm();
        renderClassSelector();
        renderClassTable();
        renderActiveTabData();
    }

    function editClass(id) {
        const cls = appData.classes.find(c => c.id === id);
        if (cls) {
            document.getElementById('classId').value = cls.id;
            document.getElementById('className').value = cls.name;
            document.getElementById('teacherName').value = cls.teacher;
            document.getElementById('classLevel').value = cls.level;
        }
    }

    function resetClassForm() {
        const form = document.getElementById('classForm');
        if (form) form.reset();
        const idInp = document.getElementById('classId');
        if (idInp) idInp.value = '';
    }

    function deleteClass(id) {
        if (confirm("Deseja realmente excluir esta turma? Todos os registros serão perdidos.")) {
            appData.classes = appData.classes.filter(c => c.id !== id);
            if (appData.classes.length > 0) {
                appData.currentClassId = appData.classes[0].id;
            } else {
                appData.currentClassId = null;
            }
            saveData();
            renderClassSelector();
            renderClassTable();
            renderActiveTabData();
        }
    }

    function importBulkStudents() {
        const activeClass = getActiveClass();
        if (!activeClass) return alert("Selecione ou cadastre uma turma primeiro!");
        const input = document.getElementById('bulkStudentsText');
        if (!input) return;

        const lines = input.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        lines.forEach(name => {
            activeClass.students.push({
                id: 's_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                name
            });
        });

        input.value = '';
        saveData();
        renderStudentList();
        renderNonParticipantsChecklist();
    }

    function renderStudentList() {
        const activeClass = getActiveClass();
        const tbody = document.getElementById('studentListTable');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (!activeClass) return;

        activeClass.students.forEach((s, idx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${idx + 1}</td>
                <td>${s.name}</td>
                <td>
                    <button class="btn btn-danger" style="padding: 2px 6px; font-size:0.75rem;" onclick="deleteStudent('${s.id}')">Remover</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteStudent(id) {
        const activeClass = getActiveClass();
        if (activeClass && confirm("Remover aluno?")) {
            activeClass.students = activeClass.students.filter(s => s.id !== id);
            saveData();
            renderStudentList();
            renderNonParticipantsChecklist();
        }
    }

    // --- GERENCIAMENTO DE AULAS ---
    function filterStudentChecklist() {
        const query = document.getElementById('searchStudentInput').value.toLowerCase();
        const items = document.querySelectorAll('#nonParticipantsChecklist .student-check-item');
        items.forEach(item => {
            const name = item.textContent.toLowerCase();
            item.style.display = name.includes(query) ? 'flex' : 'none';
        });
    }

    function renderNonParticipantsChecklist() {
        const container = document.getElementById('nonParticipantsChecklist');
        if (!container) return;
        container.innerHTML = '';
        const activeClass = getActiveClass();
        if (!activeClass) return;

        activeClass.students.forEach(s => {
            const div = document.createElement('div');
            div.className = 'student-check-item';
            div.innerHTML = `
                <input type="checkbox" id="check_np_${s.id}" value="${s.id}">
                <label for="check_np_${s.id}" style="cursor:pointer; flex:1;">${s.name}</label>
            `;
            container.appendChild(div);
        });
    }

    function saveLesson(e) {
        e.preventDefault();
        const activeClass = getActiveClass();
        if (!activeClass) return;

        const id = document.getElementById('lessonId').value;
        const date = document.getElementById('lessonDate').value;
        const quarter = document.getElementById('lessonQuarter').value;
        const count = parseInt(document.getElementById('lessonCount').value) || 1;
        const content = document.getElementById('lessonContent').value;

        const nonParticipantIds = [];
        const checkboxes = document.querySelectorAll('#nonParticipantsChecklist input[type="checkbox"]:checked');
        checkboxes.forEach(cb => nonParticipantIds.push(cb.value));

        if (id) {
            const lesson = activeClass.lessons.find(l => l.id === id);
            if (lesson) {
                lesson.date = date;
                lesson.quarter = quarter;
                lesson.count = count;
                lesson.content = content;
                lesson.nonParticipantIds = nonParticipantIds;
            }
        } else {
            activeClass.lessons.push({
                id: 'l_' + Date.now(),
                date,
                quarter,
                count,
                content,
                nonParticipantIds
            });
        }

        saveData();
        resetLessonForm();
        renderLessonHistory();
        renderActiveTabData();
    }

    function renderLessonHistory() {
        const activeClass = getActiveClass();
        const tbody = document.getElementById('lessonHistoryTable');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (!activeClass) return;

        activeClass.lessons.forEach(l => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${l.date}</td>
                <td>${l.quarter}º Trim</td>
                <td>${l.count}</td>
                <td>${l.content}</td>
                <td>${l.nonParticipantIds ? l.nonParticipantIds.length : 0} alunos</td>
                <td>
                    <button class="btn btn-warning" style="padding: 2px 6px; font-size:0.75rem;" onclick="editLesson('${l.id}')">Editar</button>
                    <button class="btn btn-danger" style="padding: 2px 6px; font-size:0.75rem;" onclick="deleteLesson('${l.id}')">Excluir</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function editLesson(id) {
        const activeClass = getActiveClass();
        if (!activeClass) return;
        const l = activeClass.lessons.find(item => item.id === id);
        if (l) {
            document.getElementById('lessonId').value = l.id;
            document.getElementById('lessonDate').value = l.date;
            document.getElementById('lessonQuarter').value = l.quarter;
            document.getElementById('lessonCount').value = l.count;
            document.getElementById('lessonContent').value = l.content;

            renderNonParticipantsChecklist();
            if (l.nonParticipantIds) {
                l.nonParticipantIds.forEach(studentId => {
                    const cb = document.getElementById(`check_np_${studentId}`);
                    if (cb) cb.checked = true;
                });
            }
        }
    }

    function resetLessonForm() {
        const form = document.getElementById('lessonForm');
        if (form) form.reset();
        const idInp = document.getElementById('lessonId');
        if (idInp) idInp.value = '';
        renderNonParticipantsChecklist();
    }

    function deleteLesson(id) {
        const activeClass = getActiveClass();
        if (activeClass && confirm("Deseja excluir esta aula?")) {
            activeClass.lessons = activeClass.lessons.filter(l => l.id !== id);
            saveData();
            renderLessonHistory();
            renderActiveTabData();
        }
    }

    // --- CÁLCULO DE DESCONTOS E AVALIAÇÕES ---
    function calculateParticipationLoss(studentId, quarter) {
        const activeClass = getActiveClass();
        if (!activeClass) return 0;

        let totalLoss = 0;
        activeClass.lessons.forEach(l => {
            if (l.quarter.toString() === quarter.toString() && l.nonParticipantIds && l.nonParticipantIds.includes(studentId)) {
                totalLoss += l.count * 0.5;
            }
        });
        return totalLoss;
    }

    function renderEvalInputs() {
        const activeClass = getActiveClass();
        const selectEl = document.getElementById('evalQuarterSelect');
        const thead = document.getElementById('evalTableHead');
        const tbody = document.getElementById('evalTableBody');
        const notice = document.getElementById('rulesNotice');

        if (!thead || !tbody || !selectEl) return;

        const quarter = selectEl.value;
        thead.innerHTML = '';
        tbody.innerHTML = '';
        if (!activeClass) return;

        let noticeText = "";
        let columns = [];

        if (activeClass.level === 'fund2' || activeClass.level === 'ano5') {
            noticeText = activeClass.level === 'ano5' 
                ? "Regra 5º Ano (Moldes do 6º Ano): Participação (10 pts base) menos descontos. Outros trabalhos/provas."
                : "Regra Fundamental 02 (6º ao 8º Ano): Participação (10 pts base) menos descontos. Outros trabalhos/provas.";
            columns = [{ key: 'prat', label: 'Nota Prática/AVAL' }];
        } else if (activeClass.level === 'ano9') {
            noticeText = "Regra 9º Ano: Avaliação Prática + Prova Teórica.";
            columns = [{ key: 'prat', label: 'Prática' }, { key: 'teor', label: 'Teórica' }];
        } else {
            noticeText = "Regra Ensino Médio: Avaliação Continuada + Projeto Integrado.";
            columns = [{ key: 'cont', label: 'Continuada' }, { key: 'proj', label: 'Projeto' }];
        }

        if (notice) notice.textContent = noticeText;

        let trHead = `<tr><th>Aluno</th><th>Desconto de Participação (Auto)</th>`;
        columns.forEach(c => trHead += `<th>${c.label}</th>`);
        trHead += `</tr>`;
        thead.innerHTML = trHead;

        const qKey = 'q' + quarter;
        const extraData = activeClass.extraGrades[qKey] || {};

        activeClass.students.forEach(s => {
            const loss = calculateParticipationLoss(s.id, quarter);
            const sGrades = extraData[s.id] || {};

            let tr = `<tr><td><strong>${s.name}</strong></td><td><span class="badge badge-danger">-${loss.toFixed(1)}</span></td>`;
            columns.forEach(c => {
                const val = sGrades[c.key] !== undefined ? sGrades[c.key] : '';
                tr += `<td><input type="number" step="0.1" min="0" max="10" class="eval-input" data-student="${s.id}" data-key="${c.key}" value="${val}" style="width:80px; padding:4px;"></td>`;
            });
            tr += `</tr>`;
            tbody.innerHTML += tr;
        });
    }

    function saveExtraEvaluations() {
        const activeClass = getActiveClass();
        if (!activeClass) return;

        const quarter = document.getElementById('evalQuarterSelect').value;
        const qKey = 'q' + quarter;

        if (!activeClass.extraGrades[qKey]) activeClass.extraGrades[qKey] = {};

        const inputs = document.querySelectorAll('.eval-input');
        inputs.forEach(inp => {
            const studentId = inp.getAttribute('data-student');
            const key = inp.getAttribute('data-key');
            const val = inp.value !== '' ? parseFloat(inp.value) : '';

            if (!activeClass.extraGrades[qKey][studentId]) {
                activeClass.extraGrades[qKey][studentId] = {};
            }
            activeClass.extraGrades[qKey][studentId][key] = val;
        });

        saveData();
        alert("Notas do " + quarter + "º Trimestre salvas com sucesso!");
        renderActiveTabData();
    }

    // --- TABELAS DE DETALHAMENTO DOS TRIMESTRES ---
    function calculateQuarterGrade(studentId, quarter) {
        const activeClass = getActiveClass();
        if (!activeClass) return 0;

        const loss = calculateParticipationLoss(studentId, quarter);
        const basePart = Math.max(0, 10 - loss);
        const qKey = 'q' + quarter;
        const extra = (activeClass.extraGrades[qKey] && activeClass.extraGrades[qKey][studentId]) ? activeClass.extraGrades[qKey][studentId] : {};

        if (activeClass.level === 'fund2' || activeClass.level === 'ano5') {
            const prat = extra.prat !== undefined && extra.prat !== '' ? parseFloat(extra.prat) : 10;
            return Math.min(10, (basePart + prat) / 2);
        } else if (activeClass.level === 'ano9') {
            const prat = extra.prat !== undefined && extra.prat !== '' ? parseFloat(extra.prat) : 10;
            const teor = extra.teor !== undefined && extra.teor !== '' ? parseFloat(extra.teor) : 10;
            return Math.min(10, (basePart * 0.4) + (prat * 0.3) + (teor * 0.3));
        } else {
            const cont = extra.cont !== undefined && extra.cont !== '' ? parseFloat(extra.cont) : 10;
            const proj = extra.proj !== undefined && extra.proj !== '' ? parseFloat(extra.proj) : 10;
            return Math.min(10, (basePart * 0.3) + (cont * 0.4) + (proj * 0.3));
        }
    }

    function renderQuarterTable(quarter) {
        const activeClass = getActiveClass();
        const container = document.getElementById(`table-q${quarter}-container`);
        if (!container || !activeClass) return;

        let html = `
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Aluno</th>
                        <th>Perdas p/ Não Part.</th>
                        <th>Nota de Partic. (Base 10)</th>
                        <th>Média do Trimestre</th>
                    </tr>
                </thead>
                <tbody>
        `;

        activeClass.students.forEach((s, idx) => {
            const loss = calculateParticipationLoss(s.id, quarter);
            const partGrade = Math.max(0, 10 - loss);
            const finalQuarterGrade = calculateQuarterGrade(s.id, quarter);

            html += `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${s.name}</td>
                    <td><span class="badge badge-danger">-${loss.toFixed(1)}</span></td>
                    <td>${partGrade.toFixed(1)}</td>
                    <td><strong>${finalQuarterGrade.toFixed(1)}</strong></td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // --- TABELA DE MÉDIAS E FINAIS ---
    function renderMediasTable() {
        const activeClass = getActiveClass();
        const container = document.getElementById('table-medias-container');
        if (!container || !activeClass) return;

        let html = `
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>1º Trimestre</th>
                        <th>2º Trimestre</th>
                        <th>3º Trimestre</th>
                        <th>Média Anual</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody>
        `;

        activeClass.students.forEach(s => {
            const q1 = calculateQuarterGrade(s.id, 1);
            const q2 = calculateQuarterGrade(s.id, 2);
            const q3 = calculateQuarterGrade(s.id, 3);
            const finalAvg = (q1 + q2 + q3) / 3;

            const rec = activeClass.recovery || {};
            const recAnnual = rec.annual && rec.annual[s.id] !== undefined ? parseFloat(rec.annual[s.id]) : null;

            const effectiveFinal = (recAnnual !== null && !isNaN(recAnnual)) ? Math.max(finalAvg, recAnnual) : finalAvg;
            const status = effectiveFinal >= 6.0 ? '<span class="badge badge-success">Aprovado</span>' : '<span class="badge badge-danger">Em Recuperação</span>';

            html += `
                <tr>
                    <td><strong>${s.name}</strong></td>
                    <td>${q1.toFixed(1)}</td>
                    <td>${q2.toFixed(1)}</td>
                    <td>${q3.toFixed(1)}</td>
                    <td><strong>${effectiveFinal.toFixed(1)}</strong></td>
                    <td>${status}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // --- TABELA DE RECUPERAÇÃO ---
    function renderRecoveryTable() {
        const activeClass = getActiveClass();
        const tbody = document.getElementById('recoveryTableBody');
        if (!tbody || !activeClass) return;

        tbody.innerHTML = '';
        const rec = activeClass.recovery || { q1: {}, q2: {}, q3: {}, annual: {} };

        activeClass.students.forEach(s => {
            const q1 = calculateQuarterGrade(s.id, 1);
            const q2 = calculateQuarterGrade(s.id, 2);
            const q3 = calculateQuarterGrade(s.id, 3);
            const annual = (q1 + q2 + q3) / 3;

            const recQ1 = rec.q1 && rec.q1[s.id] !== undefined ? rec.q1[s.id] : '';
            const recQ2 = rec.q2 && rec.q2[s.id] !== undefined ? rec.q2[s.id] : '';
            const recQ3 = rec.q3 && rec.q3[s.id] !== undefined ? rec.q3[s.id] : '';
            const recAnnual = rec.annual && rec.annual[s.id] !== undefined ? rec.annual[s.id] : '';

            const finalAnnual = (recAnnual !== '' && !isNaN(parseFloat(recAnnual))) ? Math.max(annual, parseFloat(recAnnual)) : annual;
            const status = finalAnnual >= 6.0 ? '<span class="badge badge-success">Aprovado</span>' : '<span class="badge badge-danger">Reprovado</span>';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${s.name}</strong></td>
                <td>${q1.toFixed(1)}</td>
                <td><input type="number" step="0.1" class="rec-inp" data-type="q1" data-student="${s.id}" value="${recQ1}" style="width:60px;"></td>
                <td>${q2.toFixed(1)}</td>
                <td><input type="number" step="0.1" class="rec-inp" data-type="q2" data-student="${s.id}" value="${recQ2}" style="width:60px;"></td>
                <td>${q3.toFixed(1)}</td>
                <td><input type="number" step="0.1" class="rec-inp" data-type="q3" data-student="${s.id}" value="${recQ3}" style="width:60px;"></td>
                <td><strong>${annual.toFixed(1)}</strong></td>
                <td><input type="number" step="0.1" class="rec-inp" data-type="annual" data-student="${s.id}" value="${recAnnual}" style="width:60px;"></td>
                <td>${status}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function saveRecoveryGrades() {
        const activeClass = getActiveClass();
        if (!activeClass) return;

        if (!activeClass.recovery) {
            activeClass.recovery = { q1: {}, q2: {}, q3: {}, annual: {} };
        }

        const inputs = document.querySelectorAll('.rec-inp');
        inputs.forEach(inp => {
            const type = inp.getAttribute('data-type');
            const studentId = inp.getAttribute('data-student');
            const val = inp.value !== '' ? parseFloat(inp.value) : '';

            if (!activeClass.recovery[type]) activeClass.recovery[type] = {};
            activeClass.recovery[type][studentId] = val;
        });

        saveData();
        alert("Notas de Recuperação salvas!");
        renderActiveTabData();
    }

    // --- RELATÓRIO DE IMPRESSÃO ---
    function renderPrintReport() {
        const activeClass = getActiveClass();
        const container = document.getElementById('printTableContainer');
        if (!container || !activeClass) return;

        const printSchool = document.getElementById('printSchoolName');
        const printClass = document.getElementById('printClassName');
        const printTeacher = document.getElementById('printTeacherName');

        if (printSchool) printSchool.textContent = appData.schoolName || 'Colégio Estadual de Educação Física';
        if (printClass) printClass.textContent = activeClass.name;
        if (printTeacher) printTeacher.textContent = activeClass.teacher;

        let html = `
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Média 1º T</th>
                        <th>Média 2º T</th>
                        <th>Média 3º T</th>
                        <th>Média Anual</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody>
        `;

        activeClass.students.forEach(s => {
            const q1 = calculateQuarterGrade(s.id, 1);
            const q2 = calculateQuarterGrade(s.id, 2);
            const q3 = calculateQuarterGrade(s.id, 3);
            const annual = (q1 + q2 + q3) / 3;

            const rec = activeClass.recovery || {};
            const recAnnual = rec.annual && rec.annual[s.id] !== undefined ? parseFloat(rec.annual[s.id]) : null;
            const finalAvg = (recAnnual !== null && !isNaN(recAnnual)) ? Math.max(annual, recAnnual) : annual;

            html += `
                <tr>
                    <td>${s.name}</td>
                    <td>${q1.toFixed(1)}</td>
                    <td>${q2.toFixed(1)}</td>
                    <td>${q3.toFixed(1)}</td>
                    <td><strong>${finalAvg.toFixed(1)}</strong></td>
                    <td>${finalAvg >= 6.0 ? 'Aprovado' : 'Retido/Recuperação'}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }
</script>
</body>
</html>
